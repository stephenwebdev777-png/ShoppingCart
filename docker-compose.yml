version: '3.8'

services:
  frontend:
    image: frontend-image
    ports:
      - '3000:3000'
    environment:
      - REACT_APP_API_URL=http://backend:5000

  backend:
    image: backend-image
    ports:
      - '5000:5000'
    environment:
      - DATABASE_URL=mongodb://mongo:27017/mydatabase

  mongo:
    image: mongo
    ports:
      - '27017:27017'
