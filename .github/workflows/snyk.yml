name: Snyk Container Scan

on:
  push:
  pull_request:

jobs:
  snyk:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Snyk
      run: npm install -g snyk

    - name: Authenticate
      run: snyk auth ${{ secrets.SNYK_TOKEN }}

    - name: Build Docker Image
      run: docker build -t shoppingcart-backend ./backend

    - name: Run Snyk Scan
      run: snyk container test shoppingcart-backend
