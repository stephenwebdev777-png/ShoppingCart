name: GitGuardian Scan

on:
  push:
  pull_request:

jobs:
  gitguardian:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: GitGuardian scan
      uses: GitGuardian/ggshield-action@v1
      env:
        GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      with:
        args: scan repo .
